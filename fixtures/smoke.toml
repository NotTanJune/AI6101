# Offline smoke experiment: checked-in fixtures, deterministic mock provider, fixture runner.
# No network access, no paid calls, no secrets. Relative paths resolve against this file.
#
#   harness validate --config fixtures/smoke.toml
#   harness run --config fixtures/smoke.toml --output target/harness-smoke

[run]
name = "smoke"
seed = 1
repetitions = 1
strategies = ["no_update", "full_rewrite", "selective_patch"]

[inputs]
adapter = "fixture"
root = "smoke"

[versions]
source = "early"
target = "late"
stages = { early = "early", middle = "middle", late = "late" }

[tasks]
ids = ["tracker-create-high-priority"]

[provider]
kind = "mock"
model = "mock-1"
mock_responses_dir = "smoke/provider"

[judge]
version = "mock-judge-1"

[budget]
# Local dispatch cap in USD. A local guard, not the provider's bill.
cap_usd = 100.0

[budget.rate_card]
id = "smoke-mock-rates"
date = "2026-01-01"
entries = []   # the mock provider is never priced

[runner]
kind = "fixture"
fixture_dir = "smoke/runner"
