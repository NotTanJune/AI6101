[package]
name = "harness-cli"
description = "Command line entry points (`harness`, `mcpe`) for the MCP tool-knowledge adaptation harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "harness_cli"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "mcpe"
path = "src/bin/mcpe.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
harness-agent.workspace = true
harness-core.workspace = true
harness-tui.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
