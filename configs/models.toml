# Model registry for the agent harness.
#
# Source of every ID, effort setting and price below: plans/model-api-facts-2026-10-04.md
# (verified 2026-10-04). Prices are USD per million tokens, Standard tier, and are dated by
# `price_date`. Reasoning tokens are billed as output tokens.
#
# Notes:
# * `accepts_sampling = false` for every model: the clients never send temperature, top_p or
#   seed. (gpt-6-astra rejects temperature and top_p.)
# * Long-context rule: OpenAI models above 272K input tokens, Gemini 3.1 Pro above 200K prompt
#   tokens; the whole request is billed at the long rates.
# * gemini-3.8-flash prices here are the promotional rates valid until 2026-12-31. From
#   2027-01-01 they become input 1.50, cached 0.15, output 7.50. Update the table then.
# * gemini-3.1-pro-preview is a preview model and may be renamed.
# * Gemini 4 Argon is intentionally absent: no verified model ID or price.

[[models]]
alias = "luna"
provider = "openai"
model_id = "gpt-6-luna"
api_key_env = "OPENAI_API_KEY"
allowed_efforts = ["none", "low", "medium", "high", "xhigh", "max"]
default_effort = "max"
accepts_sampling = false
max_output_tokens = 128000

[models.price]
input_usd_per_mtok = 0.1
output_usd_per_mtok = 0.5
cached_input_usd_per_mtok = 0.01
cache_write_usd_per_mtok = 0.125
long_context_threshold_tokens = 272000
long_input_usd_per_mtok = 0.2
long_cached_input_usd_per_mtok = 0.02
long_cache_write_usd_per_mtok = 0.25
long_output_usd_per_mtok = 0.75
price_date = "2026-10-04"

