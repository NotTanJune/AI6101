# Live Rust-to-Python run, stage "late". Generated tool KBs come from real 1MCP listings:
# early = original, middle = iter3, late = iter5 (benchmark/integration/live_setup.py).
# Serve the matching version first: benchmark/integration/serve_1mcp.sh iter5

[run]
name = "mcpevol-live-late"
seed = 42
repetitions = 1
strategies = ["no_update", "selective_patch", "full_rewrite"]

[inputs]
adapter = "fixture"
root = "../../target/live/fixture"

[versions]
source = "early"
target = "late"

[tasks]
ids = ["2", "5", "8", "21", "22", "26", "29", "30", "34", "40", "94", "161", "225", "229", "235", "249", "281", "291", "385", "448"]

[provider]
kind = "openai"
model = "gpt-6-luna"
api_key_env = "OPENAI_ETHICS_KEY"
max_output_tokens = 65536

[judge]
version = "ai6101-judge/1"

[budget]
cap_usd = 20.0

[budget.rate_card]
id = "openai-standard-2026-10-27"
date = "2026-10-27"   # https://developers.openai.com/api/docs/pricing, short-context standard tier

[[budget.rate_card.entries]]
provider = "openai"
model = "gpt-6-luna"
input_usd_per_mtok = 0.10
cached_input_usd_per_mtok = 0.01
output_usd_per_mtok = 0.50

[runner]
kind = "process"
executable = "../../benchmark/.venv/bin/python"
fixed_args = ["benchmark/integration/rust_runner.py", "--mcp-server-url", "http://127.0.0.1:3050/mcp", "--workers", "5"]
