[contracts]
tool_kb = "tool-kb/1"
run_event = "run-event/1"
run_summary = "harness-summary/1"

[harness]
version = "0.1.0"

[run]
name = "mcpevol-live-middle"
seed = 42
repetitions = 1
strategies = ["no_update", "selective_patch", "full_rewrite"]

[versions]
source = "early"
target = "middle"

[tasks]
ids = ["2", "5", "8", "21", "22", "26", "29", "30", "34", "40", "94", "161", "225", "229", "235", "249", "281", "291", "385", "448"]

[inputs]
adapter = "fixture"
release_id = "mcpevol-live-1mcp0383"
root = "../../target/live/fixture"
catalog_env = "MCP_DATA_DIR"
eval_env = "EVAL_DATA_DIR"

[provider]
kind = "openai"
model = "gpt-6-luna"
api_key_env = "OPENAI_ETHICS_KEY"
max_output_tokens = 65536

[judge]
version = "ai6101-judge/1"

[budget]
local_dispatch_cap_usd = 20.0

[budget.rate_card]
id = "openai-standard-2026-10-27"
date = "2026-10-27"

[[budget.rate_card.entries]]
provider = "openai"
model = "gpt-6-luna"
input_usd_per_mtok = 0.1
output_usd_per_mtok = 0.5
cached_input_usd_per_mtok = 0.01

[runner]
kind = "process"
executable = "../../benchmark/.venv/bin/python"
fixed_args = ["benchmark/integration/rust_runner.py", "--mcp-server-url", "http://127.0.0.1:3050/mcp", "--workers", "5"]

